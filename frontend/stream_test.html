<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Stream Test</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 90px; }
    button { margin-top: 0.5rem; padding: 0.5rem 0.9rem; }
    #out { white-space: pre-wrap; border: 1px solid #ddd; padding: 1rem; min-height: 120px; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Stream Chat Tester</h1>
  <textarea id="msg" placeholder="Type a prompt"></textarea>
  <br />
  <button id="send">Send</button>
  <button id="stop">Stop</button>
  <div id="out"></div>

  <script>
    const out = document.getElementById("out");
    const sendBtn = document.getElementById("send");
    const stopBtn = document.getElementById("stop");
    let controller = null;

    sendBtn.onclick = async () => {
      const text = document.getElementById("msg").value.trim();
      if (!text) return;

      out.textContent = "";
      controller = new AbortController();

      const url = "http://127.0.0.1:8000/chat/stream?user_input=" + encodeURIComponent(text);
      const res = await fetch(url, { method: "POST", signal: controller.signal });

      if (!res.ok || !res.body) {
        out.textContent = "Request failed: " + res.status;
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const frames = buffer.split("\n\n");
        buffer = frames.pop() || "";

        for (const frame of frames) {
          const line = frame.split("\n").find(l => l.startsWith("data: "));
          if (!line) continue;

          try {
            const payload = JSON.parse(line.slice(6));
            if (payload.type === "token") {
              out.textContent += payload.content;
            }
          } catch {}
        }
      }
    };

    stopBtn.onclick = () => {
      if (controller) controller.abort();
    };
  </script>
</body>
</html>
